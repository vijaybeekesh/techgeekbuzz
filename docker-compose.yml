version: "3.9"

services:
  # ---------------------------------------------------
  # Build Image Only Once
  # ---------------------------------------------------
  tgb_service:
    image: ki_tgb_image
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ki_tgb_service
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/code   # remove in prod
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "gunicorn -b 0.0.0.0:8080 tgbwebsite.wsgi --workers=2 --timeout=300"